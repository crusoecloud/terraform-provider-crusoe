include:
  - project: 'crusoeenergy/tools'
    file: '/templates/go.gitlab-ci.yml'

variables:
  CI_IMAGE: registry.gitlab.com/crusoeenergy/tools/go-ci-1.26
  # The go-ci images (official golang base) set GOTOOLCHAIN=local, which can't
  # fetch the Go version go.mod requires. auto downloads it.
  GOTOOLCHAIN: auto

test_and_lint:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "release"'
      changes: !reference [.code-changes, changes]
    - if: '$CI_MERGE_REQUEST_ID'
      changes: !reference [.code-changes, changes]
    # don't run CI for semver tags, do run it for custom tags
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG !~ /^(.+\/)?v[0-9]+\.[0-9]+\.[0-9]+$/'

# Every merge request needs a changelog fragment in .changelog/, unless it is
# labelled skip-changelog or only touches files no customer can notice; see
# .changelog/README.md. Not for merge requests into release: those carry the
# rendered CHANGELOG.md section, not a fragment.
changelog_check:
  needs: []
  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "release"'
      when: never
    - if: '$CI_MERGE_REQUEST_IID'
  script:
    - scripts/changelog-check.sh

# On the release branch, and in merge requests into it, the top section of
# CHANGELOG.md must be the version the GitHub workflow is about to tag, so a
# stale changelog fails here, before the merge; the workflow checks again
# before tagging. On the branch the job runs after the merge, when the
# workflow may already have tagged the commit; the script accepts that tag.
changelog_release_check:
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "release"'
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "release"'
  script:
    - scripts/release-check.sh

# The release jobs (RELEASING.md). prepare_release is the
# click that starts a release: on a main pipeline it renders CHANGELOG.md and
# opens the release-prep merge request. cut_release_candidate runs on main when
# CHANGELOG.md changes, that is when the prep merges, and opens the merge
# request into release from rc/<version>. Both commit and push as the release
# bot, whose token and signing key are protected variables (main only). In a
# merge request pipeline they appear as manual jobs when their scripts change,
# run without the bot and keep what they would have pushed as artifacts.
prepare_release:
  stage: build
  needs: []
  manual_confirmation: >-
    YOU ARE ABOUT TO PREPARE A PATCH RELEASE. IS THAT WHAT YOU WANT? For a
    minor or major release, cancel and set "version" to minor, major or vX.Y.0
    on the job page; with "version" empty the job stops if the fragments call
    for more. Nothing is published yet: this only opens the release-prep merge
    request.
  variables:
    GIT_DEPTH: 0   # go-changelog walks the history from the last tag
  inputs:
    version:
      default: ""
      description: 'Empty: the next patch of versions.env, or a stop when the fragments call for more. patch, minor, major or vX.Y.0: prepared as asked; the job bumps versions.env in the same commit for a minor or major.'
      regex: '^(v?[0-9]+\.[0-9]+\.[0-9]+|patch|minor|major)?$'
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
    - if: '$CI_MERGE_REQUEST_IID'
      changes:
        - .gitlab-ci.yml
        - scripts/changelog-build.sh
        - scripts/release-*.sh
      when: manual
      allow_failure: true
  script:
    - 'VERSION="${{ job.inputs.version }}" scripts/release-prepare.sh'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - release-prep.patch
      - release-prep-mr.md

cut_release_candidate:
  stage: deploy
  needs:
    - job: test_and_lint
      optional: true
  rules:
    # Pushes only: rules:changes is true on every web, scheduled or API
    # pipeline, which would move the candidate to whatever main's tip is then.
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - CHANGELOG.md
    - if: '$CI_MERGE_REQUEST_IID'
      changes:
        - .gitlab-ci.yml
        - scripts/release-*.sh
      when: manual
      allow_failure: true
  script:
    - scripts/release-candidate.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - release-candidate-mr.md

# Remove the tag_semver and pages jobs from merges into main.
# The tag_semver job will be run using a GitHub action on
# merges into the release branch, and we will only ever
# want to tag them using that job.
tag_semver:
  rules:
    - when: never

pages:
  rules:
    - when: never

# Slack notice when the release branch pipeline fails. A passing pipeline posts
# nothing: the GitHub workflow announces the release itself, and reports its own
# failures (.github/workflows/tag-release.yml).
notify_release_branch_failure:
  stage: .post
  image: curlimages/curl:latest
  when: on_failure
  rules:
    - if: '$CI_COMMIT_BRANCH == "release" && $CI_PIPELINE_SOURCE == "push"'
  script:
    - |
      if [ -z "$SLACK_CCX_CI_RELEASES_WEBHOOK_URL" ]; then
        echo "SLACK_CCX_CI_RELEASES_WEBHOOK_URL not configured; skipping Slack notification." >&2
        exit 0
      fi
    - COMMIT_SHORT=$(echo $CI_COMMIT_SHA | cut -c1-8)
    - |
      # JSON-escape: display names are free text, and the curl image has no jq.
      TRIGGERED_BY=$(printf '%s' "$GITLAB_USER_NAME" | sed 's/\\/\\\\/g; s/"/\\"/g')
    - |
      curl -sS --fail-with-body --max-time 10 -X POST "$SLACK_CCX_CI_RELEASES_WEBHOOK_URL" \
        -H 'Content-Type: application/json' \
        -d '{
          "text": "Terraform Provider Crusoe release branch pipeline failed",
          "blocks": [
            {
              "type": "header",
              "text": {
                "type": "plain_text",
                "text": "Terraform Provider Crusoe Release Branch Pipeline Failed"
              }
            },
            {
              "type": "section",
              "fields": [
                {
                  "type": "mrkdwn",
                  "text": "*Branch:*\n'"$CI_COMMIT_BRANCH"'"
                },
                {
                  "type": "mrkdwn",
                  "text": "*Commit:*\n'"$COMMIT_SHORT"'"
                },
                {
                  "type": "mrkdwn",
                  "text": "*Triggered by:*\n'"$TRIGGERED_BY"'"
                }
              ]
            },
            {
              "type": "section",
              "text": {
                "type": "mrkdwn",
                "text": "The GitHub release workflow does not wait for this pipeline: check whether it published the release, and fix the failing jobs on `main`."
              }
            },
            {
              "type": "actions",
              "elements": [
                {
                  "type": "button",
                  "text": {
                    "type": "plain_text",
                    "text": "View Failed Pipeline"
                  },
                  "url": "'"$CI_PIPELINE_URL"'",
                  "style": "danger"
                }
              ]
            }
          ]
        }'
  allow_failure: true

# Crusoe Updates (RELEASING.md): once the GitHub release carries
# release-manifest.json, the docs pipeline imports it and opens the merge
# request with the site entries. wait_for_release polls for the file, since
# the GitHub workflow runs after the push mirror and uploads it last, and
# writes RELEASE_VERSION to release.env; notify_docs then starts the docs
# pipeline with it and RELEASE_ARTIFACT. inherit:variables:false keeps this
# project's variables out of that pipeline.
wait_for_release:
  stage: .post
  needs: []
  timeout: 45m
  rules:
    - if: '$CI_COMMIT_BRANCH == "release"'
  script:
    - scripts/release-wait.sh
  artifacts:
    reports:
      dotenv: release.env

notify_docs:
  stage: .post
  needs:
    - job: wait_for_release
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "release"'
  inherit:
    variables: false
  variables:
    RELEASE_ARTIFACT: terraform
  trigger:
    project: crusoeenergy/island/external/docs
    branch: main
    strategy: mirror
    forward:
      pipeline_variables: true
  allow_failure: true
